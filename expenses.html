<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spend</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #15121f;
    --surface: #1e1a2e;
    --line: #2f2a45;
    --text: #efeaff;
    --muted: #8f87b3;
    --accent: #ff7ab6;
    --radius: 18px;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f6f3ff;
      --surface: #ffffff;
      --line: #e3ddf7;
      --text: #1c1730;
      --muted: #7a7299;
      --accent: #d6307f;
      color-scheme: light;
    }
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: "Bricolage Grotesque", ui-rounded, "Segoe UI", system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 18px 60px;
  }
  .wrap { max-width: 980px; margin: 0 auto; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 12px; }
  h1 { font-size: 28px; font-weight: 800; letter-spacing: -0.03em; }
  .month { display: flex; align-items: center; gap: 4px; }
  .month span { min-width: 140px; text-align: center; font-weight: 600; }
  button { font: inherit; color: inherit; cursor: pointer; }
  .icon-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--surface); display: grid; place-items: center; transition: border-color .15s, transform .15s;
  }
  .icon-btn:hover { border-color: var(--accent); }
  .icon-btn:active { transform: scale(.92); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .grid { display: grid; grid-template-columns: 1fr 1.1fr; gap: 20px; align-items: start; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; }

  /* ring */
  .ring-wrap { position: relative; width: 240px; height: 240px; margin: 0 auto 18px; }
  .ring-wrap svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring-wrap circle { fill: none; stroke-width: 20; transition: stroke-dasharray .6s cubic-bezier(.3,.8,.3,1), stroke-dashoffset .6s cubic-bezier(.3,.8,.3,1), opacity .2s; }
  .ring-center { position: absolute; inset: 0; display: grid; place-content: center; text-align: center; pointer-events: none; }
  .ring-center b { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; }
  .ring-center small { color: var(--muted); font-size: 13px; margin-top: 2px; }

  .legend { display: grid; gap: 4px; }
  .leg {
    display: grid; grid-template-columns: 12px 1fr auto; gap: 10px; align-items: center;
    padding: 9px 10px; border-radius: 12px; border: 1px solid transparent; background: none; width: 100%; text-align: left;
    transition: background .15s, opacity .2s;
  }
  .leg:hover { background: color-mix(in srgb, var(--line) 50%, transparent); }
  .leg.on { border-color: var(--line); background: color-mix(in srgb, var(--line) 60%, transparent); }
  .dot { width: 12px; height: 12px; border-radius: 50%; }
  .leg em { font-style: normal; color: var(--muted); font-size: 13px; margin-left: 6px; }
  .leg .bar { grid-column: 2 / 4; height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: -2px; }
  .leg .bar i { display: block; height: 100%; border-radius: 4px; transition: width .6s cubic-bezier(.3,.8,.3,1); }

  /* budget */
  .budget { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; color: var(--muted); font-size: 14px; }
  .bfield { display: flex; align-items: baseline; gap: 4px; border-bottom: 1px solid var(--line); transition: border-color .15s; }
  .bfield:focus-within { border-color: var(--accent); }
  .bfield input { width: 90px; background: none; border: 0; outline: none; color: var(--text); font: inherit; font-weight: 600; text-align: right; }
  .meter { height: 6px; border-radius: 6px; background: var(--line); overflow: hidden; margin-bottom: 12px; }
  .meter i { display: block; height: 100%; width: 0; border-radius: 6px; background: var(--ok, #5fe0b7); transition: width .6s cubic-bezier(.3,.8,.3,1), background .3s; }
  .meter.near { --ok: #ffc857; }
  .meter.over { --ok: #ff5a6e; }
  .warn { display: none; padding: 11px 14px; border-radius: 12px; font-size: 14px; font-weight: 600; margin-bottom: 18px; }
  .warn.near { display: block; background: color-mix(in srgb, #ffc857 18%, transparent); color: #ffc857; }
  .warn.over { display: block; background: color-mix(in srgb, #ff5a6e 18%, transparent); color: #ff5a6e; }
  @media (prefers-color-scheme: light) { .warn.near { color: #9a6b00; } .warn.over { color: #c4223a; } }
  .ring-center b.over { color: #ff5a6e; }

  /* add */
  .amount { display: flex; align-items: baseline; gap: 6px; border-bottom: 2px solid var(--line); padding-bottom: 6px; transition: border-color .15s; }
  .amount:focus-within { border-color: var(--accent); }
  .amount span { font-size: 32px; color: var(--muted); font-weight: 600; }
  .amount input { font-size: 44px; font-weight: 800; letter-spacing: -0.03em; width: 100%; background: none; border: 0; color: var(--text); outline: none; font-family: inherit; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
  .chip {
    display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px;
    border: 1px solid var(--line); background: none; font-size: 14px; transition: all .15s;
  }
  .chip:hover { border-color: var(--muted); }
  .chip.on { background: var(--c); border-color: var(--c); color: #15121f; font-weight: 600; }
  .chip.on .dot { background: #15121f !important; }
  .chip input { background: none; border: 0; outline: none; color: var(--text); width: 90px; font: inherit; }
  .row { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .field {
    background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 11px 14px;
    color: var(--text); font: inherit; width: 100%; outline: none; transition: border-color .15s;
  }
  .field:focus { border-color: var(--accent); }
  .add {
    margin-top: 14px; width: 100%; padding: 14px; border-radius: 14px; border: 0;
    background: var(--accent); color: #15121f; font-weight: 800; font-size: 16px; transition: transform .12s, filter .15s;
  }
  .add:hover { filter: brightness(1.08); }
  .add:active { transform: scale(.98); }
  .err { color: var(--accent); font-size: 13px; min-height: 18px; margin-top: 8px; }

  /* list */
  .list-head { display: flex; justify-content: space-between; align-items: center; margin: 26px 0 8px; }
  .list-head h2 { font-size: 16px; font-weight: 600; }
  .link { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
  .link:hover { color: var(--text); }
  .item { display: grid; grid-template-columns: 12px 1fr auto 28px; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); animation: pop .35s ease; }
  .item small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .item b { font-weight: 600; }
  .del { background: none; border: 0; color: var(--muted); font-size: 18px; border-radius: 8px; height: 28px; opacity: .5; transition: opacity .15s, color .15s; }
  .item:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--accent); }
  .empty { color: var(--muted); padding: 22px 0; text-align: center; }
  @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Spend</h1>
    <div class="month">
      <button class="icon-btn" id="prev" aria-label="Previous month">‹</button>
      <span id="monthLabel"></span>
      <button class="icon-btn" id="next" aria-label="Next month">›</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel" aria-label="Summary">
      <div class="ring-wrap">
        <svg viewBox="0 0 200 200" id="ring" aria-hidden="true"></svg>
        <div class="ring-center"><b id="total">₹0</b><small id="sub">spent this month</small></div>
      </div>
      <div class="budget">
        <label for="budget">Monthly budget</label>
        <div class="bfield"><span>₹</span><input id="budget" type="number" inputmode="decimal" min="0" placeholder="Set limit"></div>
      </div>
      <div class="meter" id="meter"><i></i></div>
      <div class="warn" id="warn" role="status"></div>
      <div class="legend" id="legend"></div>
    </section>

    <section class="panel" aria-label="Add expense">
      <div class="amount"><span>₹</span><input id="amt" type="number" inputmode="decimal" min="0" step="any" placeholder="0" aria-label="Amount"></div>
      <div class="chips" id="chips"></div>
      <div class="row">
        <input class="field" id="note" type="text" maxlength="60" placeholder="What was it for? (optional)" aria-label="Note">
        <input class="field" id="date" type="date" aria-label="Date">
      </div>
      <button class="add" id="addBtn">Add expense</button>
      <div class="err" id="err" role="alert"></div>

      <div class="list-head">
        <h2 id="listTitle">Expenses</h2>
        <button class="link" id="csv">Download CSV</button>
      </div>
      <div id="list"></div>
    </section>
  </main>
</div>

<script>
(() => {
  const KEY = "spend-v1";
  const PALETTE = ["#ff7ab6","#7aa8ff","#ffc857","#5fe0b7","#b48cff","#ff8f5a","#6fd3ff","#c7e86a"];
  const DEFAULT_CATS = ["Food","Transport","Bills","Shopping","Health","Fun","Other"]
    .map((name, i) => ({ name, color: PALETTE[i % PALETTE.length] }));

  // storage: localStorage when available, in-memory otherwise
  let mem = null;
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || mem; } catch (e) { return mem; } };
  const save = () => { mem = { cats: S.cats, items: S.items, budget: S.budget }; try { localStorage.setItem(KEY, JSON.stringify(mem)); } catch (e) {} };

  const pad = n => String(n).padStart(2, "0");
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const inr = n => "₹" + Number(n).toLocaleString("en-IN", { maximumFractionDigits: 2 });
  const esc = s => s.replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const $ = id => document.getElementById(id);

  const saved = load();
  const S = {
    cats: saved?.cats || DEFAULT_CATS,
    items: saved?.items || [],
    budget: saved?.budget || 0,
    view: new Date(),
    pick: null,
    filter: null,
    hover: null,
    adding: false,
  };
  S.view.setDate(1);
  S.pick = S.cats[0].name;
  $("date").value = ymd(new Date());

  const colorOf = name => (S.cats.find(c => c.name === name) || { color: "#8f87b3" }).color;
  const monthKey = () => `${S.view.getFullYear()}-${pad(S.view.getMonth() + 1)}`;
  const monthItems = () => S.items.filter(i => i.date.startsWith(monthKey()));

  function renderRing(totals, total) {
    const R = 80, C = 2 * Math.PI * R;
    let off = 0;
    let html = `<circle cx="100" cy="100" r="${R}" stroke="var(--line)" opacity=".6"/>`;
    totals.forEach(t => {
      const len = Math.max(0, (t.sum / total) * C - 3);
      const dim = (S.hover || S.filter) && (S.hover || S.filter) !== t.name ? 0.25 : 1;
      html += `<circle cx="100" cy="100" r="${R}" stroke="${t.color}" stroke-linecap="round"
        stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-off}" opacity="${dim}"/>`;
      off += (t.sum / total) * C;
    });
    $("ring").innerHTML = html;
  }

  function render() {
    $("monthLabel").textContent = S.view.toLocaleDateString("en-IN", { month: "long", year: "numeric" });
    const items = monthItems();
    const total = items.reduce((a, i) => a + i.amt, 0);

    const totals = S.cats
      .map(c => ({ name: c.name, color: c.color, sum: items.filter(i => i.cat === c.name).reduce((a, i) => a + i.amt, 0) }))
      .filter(t => t.sum > 0)
      .sort((a, b) => b.sum - a.sum);

    // center
    const shown = S.filter ? (totals.find(t => t.name === S.filter)?.sum || 0) : total;
    $("total").textContent = inr(shown);
    $("sub").textContent = S.filter ? `on ${S.filter.toLowerCase()}` : "spent this month";

    renderRing(totals, total || 1);

    // budget meter + warning
    const B = S.budget, pct = B > 0 ? total / B : 0;
    const level = B > 0 ? (pct >= 1 ? "over" : pct >= 0.8 ? "near" : "") : "";
    $("meter").className = "meter " + level;
    $("meter").firstElementChild.style.width = Math.min(100, pct * 100) + "%";
    $("total").className = level === "over" && !S.filter ? "over" : "";
    const warn = $("warn");
    warn.className = "warn " + level;
    warn.textContent = level === "over"
      ? `Over budget by ${inr(total - B)}. Hold off on new spending this month.`
      : level === "near"
        ? `You've used ${Math.round(pct * 100)}% of your budget. ${inr(B - total)} left.`
        : "";

    // legend
    $("legend").innerHTML = totals.length
      ? totals.map(t => `
        <button class="leg ${S.filter === t.name ? "on" : ""}" data-cat="${esc(t.name)}">
          <span class="dot" style="background:${t.color}"></span>
          <span>${esc(t.name)}<em>${Math.round((t.sum / total) * 100)}%</em></span>
          <b>${inr(t.sum)}</b>
          <span class="bar"><i style="width:${(t.sum / totals[0].sum) * 100}%;background:${t.color}"></i></span>
        </button>`).join("")
      : `<div class="empty">Nothing here yet. Add an expense to see where your money goes.</div>`;

    // chips
    $("chips").innerHTML = S.cats.map(c => `
      <button class="chip ${S.pick === c.name ? "on" : ""}" style="--c:${c.color}" data-pick="${esc(c.name)}">
        <span class="dot" style="background:${c.color}"></span>${esc(c.name)}
      </button>`).join("") +
      (S.adding
        ? `<span class="chip"><input id="newCat" maxlength="14" placeholder="Name" aria-label="New category name"></span>`
        : `<button class="chip" id="newBtn">+ New</button>`);
    if (S.adding) $("newCat").focus();

    // list
    const shownItems = items
      .filter(i => !S.filter || i.cat === S.filter)
      .sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
    $("listTitle").textContent = S.filter ? `${S.filter} expenses` : "Expenses";
    $("list").innerHTML = shownItems.length
      ? shownItems.map(i => `
        <div class="item">
          <span class="dot" style="background:${colorOf(i.cat)}"></span>
          <div><b>${esc(i.note || i.cat)}</b>
            <small>${esc(i.cat)} · ${new Date(i.date + "T00:00").toLocaleDateString("en-IN", { day: "numeric", month: "short" })}</small></div>
          <b>${inr(i.amt)}</b>
          <button class="del" data-del="${i.id}" aria-label="Delete expense">×</button>
        </div>`).join("")
      : `<div class="empty">No expenses ${S.filter ? "in this category" : "this month"}.</div>`;
  }

  // events
  $("budget").value = S.budget || "";
  $("budget").addEventListener("input", e => {
    const v = parseFloat(e.target.value);
    S.budget = v > 0 ? v : 0;
    save(); render();
  });

  $("prev").onclick = () => { S.view.setMonth(S.view.getMonth() - 1); S.filter = null; render(); };
  $("next").onclick = () => { S.view.setMonth(S.view.getMonth() + 1); S.filter = null; render(); };

  $("legend").addEventListener("click", e => {
    const b = e.target.closest("[data-cat]"); if (!b) return;
    S.filter = S.filter === b.dataset.cat ? null : b.dataset.cat; render();
  });
  $("legend").addEventListener("mouseover", e => {
    const b = e.target.closest("[data-cat]"); const n = b ? b.dataset.cat : null;
    if (n !== S.hover) { S.hover = n; render(); }
  });
  $("legend").addEventListener("mouseleave", () => { if (S.hover) { S.hover = null; render(); } });

  $("chips").addEventListener("click", e => {
    const p = e.target.closest("[data-pick]");
    if (p) { S.pick = p.dataset.pick; render(); return; }
    if (e.target.closest("#newBtn")) { S.adding = true; render(); }
  });
  $("chips").addEventListener("keydown", e => {
    if (e.target.id !== "newCat") return;
    if (e.key === "Escape") { S.adding = false; render(); }
    if (e.key === "Enter") {
      const name = e.target.value.trim();
      if (name && !S.cats.some(c => c.name.toLowerCase() === name.toLowerCase())) {
        S.cats.push({ name, color: PALETTE[S.cats.length % PALETTE.length] });
        S.pick = name; save();
      }
      S.adding = false; render();
    }
  });

  function add() {
    const amt = parseFloat($("amt").value);
    const date = $("date").value;
    if (!(amt > 0)) { $("err").textContent = "Enter an amount greater than 0."; $("amt").focus(); return; }
    if (!date) { $("err").textContent = "Pick a date."; return; }
    $("err").textContent = "";
    S.items.push({ id: Date.now(), amt, cat: S.pick, note: $("note").value.trim(), date });
    save();
    // jump to the month of the new expense
    const d = new Date(date + "T00:00"); S.view = new Date(d.getFullYear(), d.getMonth(), 1);
    $("amt").value = ""; $("note").value = ""; $("amt").focus();
    render();
  }
  $("addBtn").onclick = add;
  ["amt", "note"].forEach(id => $(id).addEventListener("keydown", e => { if (e.key === "Enter") add(); }));

  $("list").addEventListener("click", e => {
    const b = e.target.closest("[data-del]"); if (!b) return;
    S.items = S.items.filter(i => String(i.id) !== b.dataset.del); save(); render();
  });

  $("csv").onclick = () => {
    const rows = [["Date", "Category", "Note", "Amount"], ...monthItems().map(i => [i.date, i.cat, `"${i.note.replace(/"/g, '""')}"`, i.amt])];
    const url = URL.createObjectURL(new Blob([rows.map(r => r.join(",")).join("\n")], { type: "text/csv" }));
    const a = document.createElement("a"); a.href = url; a.download = `expenses-${monthKey()}.csv`; a.click();
    URL.revokeObjectURL(url);
  };

  render();
})();
</script>
</body>
</html>
